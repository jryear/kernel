[project]
name = "kernel"
outcome = "verify.py becomes a lean production gate: it refuses to run when tampered with, cleans up every process a check starts, and catches checks that change protected files, with no added dependencies and negligible per-run cost."
main = "next"
instruction_version = 8
# Landing rule: 3.2.0 work lands on `next`, never `main`. main stays byte-equal to the installed 3.1.0 judge until the release item switches it.
# - Plan edits are committed on main (the plan the installed checkout reads) and merged into next.
# Release rule: the installed release judges the next one.
# - 3.2.0 is built in a separate worktree. ~/code/_kernel stays on installed 3.1.0, read-only until release gates pass.
# - Freeze each item's complete tests/fixtures first; named new assertions must FAIL against 3.1.0 and PASS on the candidate.
# - The six existing self-tests are regressions, not evidence for new guarantees. Setup/CLI errors are not RED.
# - Judge, frozen contracts/fixtures, final logs and expected digest stay outside candidate write authority.
# - Judge invocations use python3 -B and nested Python uses PYTHONDONTWRITEBYTECODE=1; inventory the judge directory before/after.
# Zack, 2026-11-10: "fuck the sandbox". 3.2.0 ships WITHOUT a sandbox: self-check + cleanup + protected-path integrity, stdlib only, fast on every run.
# Sandbox branches (kernel/sandbox*, v1-v6) and docs/SANDBOX_DECISION.md are retained as history only; nothing below depends on them.
# Historical verdict rule (sandbox era, amendments 2026-11-06 and 2026-11-09):
# Verdict boundary: docs/SANDBOX_DECISION.md, including amendments 2026-11-06 and 2026-11-09.
# Unverifiable precedes contradicted, which precedes supported; retain measured contradiction facts.
# Observed attributed relevant unexpected denial at any phase -> unverifiable.
# Enabled collector fault/death/overflow/known loss, invalid evidence, ambiguous relevant attribution,
# cross-invocation contamination or incomplete bounded drain -> unverifiable. No silent fallback.
# Logs are diagnostic, absence proves nothing: missing events/canary alone never gate support.
# Bound canary logging is diagnostic; independent same-policy operation preflight still gates launch.
# Supported is bounded observable contract evidence; swallowed undelivered denials may be supported.
# Hashes do not prove no attempts, no transient writes or read denial. Disabled mode stays explicit.

[[item]]
id = "self-check"
title = "Verifier refuses to run unless its files match a release digest held outside the candidate"
mandate = "Zack, 2026-11-03: production suite. A tampered judge must not judge. The manifest beside the verifier only counts if it is itself trusted, so the expected digest is supplied by the caller or the release tag, not read from the kernel dir."
acceptance = [["python3", "tests/self_check.py"]]
# Cases: altered verifier, altered manifest, altered runtime module, missing digest -> refuse (exit 3), never verdict.

[[item]]
id = "cleanup"
title = "Each check runs in its own process group; survivors are named in the receipt and make the verdict unverifiable"
mandate = "Zack, 2026-11-03: production suite. 'Service cleanup' stays on the limits list until an escape test proves the boundary."
acceptance = [["python3", "tests/cleanup.py"]]
# Cases: child in group (killed), child that setsid()s out (detected as survivor), timeout, kill failure.

[[item]]
id = "sandbox-spike"
title = "Spike decides the sandbox architecture: srt CLI vs embedded library, tamper detection by hashing, logs as explanation only"
mandate = "Zack, 2026-11-03. Verified in srt 0.0.81 source: CLI initializes without the log monitor; library has opt-in enableLogMonitor; violation store keeps the last 100 events. Upstream reports of dropped/misattributed macOS events are unreproduced."
acceptance = [["python3", "spike/sandbox_probe.py"]]
# Probe both paths separately: collector started before the check, a known-denied canary,
# bursts beyond 100 denials, events arriving after exit. Output: which path, and what evidence it can and cannot give.

[[item]]
id = "integrate-1"
title = "Integration: self-check + cleanup combined; both frozen contracts supported by 3.1.0 on the combined tree; manifest regenerated from final contents"
# Integrates proven-but-unmerged branches; desk deps mean done (merged), so none are declared here.
mandate = "Zack, 2026-11-03 review: neither branch's verdict proves the combination. Expected digest comes from a trusted release receipt outside the checked files."
acceptance = [["python3", "tests/self_check.py"], ["python3", "tests/cleanup.py"], ["python3", "-B", "selftest.py"]]

[[item]]
id = "integrity"
title = "Hash protected paths before and after every check; any lasting change makes the claim contradicted (stdlib, milliseconds)"
mandate = "Zack, 2026-11-10: no sandbox; the kernel must be lean, fast and reliable on every task. Closes the headline gap (a check edits tests/contract/judge files and still gets supported) by deterministic detection. Detects lasting changes only; write-then-restore during a check is a documented limit."
depends = ["integrate-1"]
acceptance = [["python3", "-B", "tests/integrity.py"]]

[[item]]
id = "red-team"
title = "Short adversarial review of integrity + self-check + cleanup before release"
mandate = "Zack, 2026-11-10: lean. One short adversarial review (not a new suite) of integrity, self-check and cleanup: try to get a false supported by changing protected files, escaping cleanup, or bypassing the digest. Record findings; fix or document as limits."
depends = ["integrity"]
acceptance = [["python3", "-B", "selftest.py"]]

[[item]]
id = "bidzizi-gate"
title = "Run BidZizi's actual invocation against final 3.2.0 with the caller-held digest before the installed judge switches"
mandate = "Zack, 2026-11-03; simplified 2026-11-10. 3.2.0 requires --release-sha256, so every current BidZizi call breaks. Prove a real call succeeds with the digest and refuses without it or with a wrong one; update the caller."
depends = ["integrity"]
acceptance = [["python3", "-B", "tests/bidzizi_invocation.py"]]

[[item]]
id = "release"
title = "Release 3.2.0: rejudge integrity/self-check/cleanup contracts with installed 3.1.0, tag, switch the installed judge"
mandate = "Zack, 2026-11-03; simplified 2026-11-10 (no sandbox). Rejudge frozen contracts with installed 3.1.0 using python3 -B, regenerate the manifest, publish the release digest, tag, and switch the installed judge only with Zack's go."
depends = ["bidzizi-gate", "red-team"]
acceptance = [["shasum", "-a", "256", "-c", "MANIFEST.sha256"], ["python3", "-B", "tests/self_check.py"], ["python3", "-B", "tests/cleanup.py"], ["python3", "-B", "tests/integrity.py"], ["python3", "-B", "tests/bidzizi_invocation.py"], ["python3", "-B", "selftest.py"]]
# Acceptance commands supplement, never replace, the external 3.1.0 frozen-contract receipts.
# Release authentication uses caller-held trusted digests; regenerate manifest from final contents before final proof.
